<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum WebGL Three.js: Interactive Picking & GUI</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; left: 10px; color: white;
            background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px;
            pointer-events: none;
        }
    </style>

    <!-- Import Three.js dan Library Pendukung via CDN -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="info">
        <h3>WebGL Three.js Picking & GUI</h3>
        <p>Arahkan kursor mouse untuk <b>Highlight</b> objek.<br>
        Klik Kiri pada objek untuk <b>Seleksi (Picking & Pulsating)</b>.</p>
        <p>Objek Terpilih ID: <span id="selected-id" style="color:#00ffcc;">-</span></p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        // 1. Setup Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a24);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Add OrbitControls & Lighting
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 3. Generate Multiple 3D Objects
        let objectsGroup = [];
        const geometries = [
            new THREE.BoxGeometry(1.2, 1.2, 1.2),
            new THREE.SphereGeometry(0.8, 32, 32),
            new THREE.ConeGeometry(0.8, 1.5, 32)
        ];

        for (let i = 0; i < 15; i++) {
            const geom = geometries[i % 3];
            const mat = new THREE.MeshStandardMaterial({
                color: Math.random() * 0xffffff,
                roughness: 0.3,
                metalness: 0.2
            });

            const mesh = new THREE.Mesh(geom, mat);
            mesh.position.x = (Math.random() - 0.5) * 10;
            mesh.position.y = (Math.random() - 0.5) * 4 + 1;
            mesh.position.z = (Math.random() - 0.5) * 10;

            mesh.userData = { id: `Objek_3D_${i + 1}`, originalColor: mat.color.getHex() };
            scene.add(mesh);
            objectsGroup.push(mesh);
        }

        // 4. Setup Raycaster for Picking
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredObject = null;
        let selectedObject = null;
        let pulseTimer = 0;

        window.addEventListener('pointermove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objectsGroup);

            if (hoveredObject && hoveredObject !== selectedObject) {
                hoveredObject.material.emissive.setHex(0x000000);
            }

            if (intersects.length > 0) {
                hoveredObject = intersects[0].object;
                if (hoveredObject !== selectedObject) {
                    hoveredObject.material.emissive.setHex(0x333333);
                }
            } else {
                hoveredObject = null;
            }
        });

        window.addEventListener('click', () => {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objectsGroup);

            if (intersects.length > 0) {
                if (selectedObject) {
                    selectedObject.material.emissive.setHex(0x000000);
                    selectedObject.scale.set(1, 1, 1);
                }

                selectedObject = intersects[0].object;
                selectedObject.material.emissive.setHex(0x00ffcc);
                document.getElementById('selected-id').innerText = selectedObject.userData.id;

                pulseTimer = 0;
            }
        });

        // 5. GUI Overlay (lil-gui)
        const gui = new GUI({ title: 'Atribut Objek Terpilih' });
        const guiParams = {
            scale: 1,
            color: '#00ffcc',
            deleteObject: () => {
                if (selectedObject) {
                    scene.remove(selectedObject);
                    objectsGroup = objectsGroup.filter(obj => obj !== selectedObject);
                    if (selectedObject.geometry) selectedObject.geometry.dispose();
                    
                    selectedObject = null;
                    document.getElementById('selected-id').innerText = '- (Terhapus)';
                } else {
                    alert('Pilih objek terlebih dahulu untuk menghapus!');
                }
            },
            resetScene: () => {
                location.reload();
            }
        };

        gui.add(guiParams, 'scale', 0.5, 3).name('Skala Objek').onChange(v => {
            if (selectedObject) selectedObject.scale.set(v, v, v);
        });
        gui.addColor(guiParams, 'color').name('Warna Emissive').onChange(c => {
            if (selectedObject) selectedObject.material.emissive.setHex(c);
        });

        gui.add(guiParams, 'deleteObject').name('🗑️ Hapus Objek Terpilih');
        gui.add(guiParams, 'resetScene').name('🔄 Reset Scene');

        // 6. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            objectsGroup.forEach(obj => obj.rotation.y += 0.005);

            if (selectedObject) {
                pulseTimer += 0.08;
                const scaleFactor = 1 + Math.sin(pulseTimer) * 0.15;
                selectedObject.scale.set(scaleFactor, scaleFactor, scaleFactor);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
